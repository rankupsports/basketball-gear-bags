<!-- ============================================================
     BASKETBALL GEAR BAGS 特設LP — 商品ページ埋め込み用コード
     貼り先: www.rankup-sports.com/product-page/basketball-gear-bags
             「レビュー」ブロックのすぐ上
     貼り方: Wix エディタ → 追加(+) → 埋め込み＆ソーシャル
             → 「HTML コードを埋め込む」を配置 → 「コードを入力」
             → 下の <meta> 以降をすべて貼り付け

     サイズ（エディタ側で枠のサイズを指定してください。中身は枠いっぱいに追従します）
       PC       : 幅 980px（= サイト幅いっぱい） × 高さ 820px
       モバイル : 幅 320px（= モバイル canvas いっぱい） × 高さ 560px
     ※ もっと小さく収めたいときは PC 980×620 でも成立します（下限 420px）。

     ■ 動き
       枠の中で LP をそのままスクロールして見られる。
       全画面にしたいときだけ右下の「全画面表示」を押す。全画面 API が使えない
       環境（iPhone Safari など）では別タブで LP を開く。
       全画面中は右上の「閉じる」または Esc でプレビューに戻る。

     メモ
       - loading="lazy" なので、レビュー位置まで実際にスクロールされるまで
         LP 内の動画（合計 60MB 超）は読み込まれません。
       - LP 内の BUY NOW はリンクを切ってあるので、商品ページ → LP → 商品ページ の
         ループにはなりません。復活させるときは LP 側 index.html の BUY_LINK を戻します。
       - PC では iframe 上にカーソルがあるとホイールが LP 側に効きます。気になる場合は
         枠の高さを 620px 前後に抑えると、脇から商品ページをスクロールしやすくなります。
     ============================================================ -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; }

  .lpEmbed {
    position: relative;
    height: 100%;
    min-height: 420px;
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;                      /* 読み込み中の地色 */
    box-shadow: 0 10px 30px rgba(0, 0, 0, .14);
  }
  /* 枠の中でそのままスクロールできる（pointer-events は触らない） */
  .lpEmbed iframe { display: block; width: 100%; height: 100%; border: 0; }

  /* ---- 全画面中 ---- */
  .lpEmbed.is-fs { border-radius: 0; box-shadow: none; }

  /* ---- チップ（右下の全画面ボタン / 右上の閉じる） ---- */
  .lpChip {
    position: absolute; z-index: 3;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border: 0; border-radius: 999px;
    background: rgba(20, 20, 26, .72); color: #fff; text-decoration: none;
    font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue",
          "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    cursor: pointer; transition: background .2s ease;
  }
  .lpChip:hover { background: rgba(20, 20, 26, .92); }
  .lpChip:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .lpChip[hidden] { display: none; }

  .lpEmbed__open  { right: 12px; bottom: 12px; }
  .lpEmbed__close { right: 12px; top: 12px; }

  @media (max-width: 600px) {
    .lpEmbed { border-radius: 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }
    .lpChip { padding: 7px 12px; font-size: 12px; }
    .lpEmbed__open  { right: 8px; bottom: 8px; }
    .lpEmbed__close { right: 8px; top: 8px; }
  }
</style>

<div class="lpEmbed" id="lpEmbed">
  <iframe id="lpFrame"
    src="https://rankupsports.github.io/basketball-gear-bags/"
    title="BASKETBALL GEAR BAGS 特設ページ"
    loading="lazy"
    allow="autoplay; fullscreen"
    referrerpolicy="no-referrer-when-downgrade"
    scrolling="yes"></iframe>

  <!-- JS が動かない環境ではただの別タブリンクとして機能する -->
  <a class="lpChip lpEmbed__open" id="lpOpen"
     href="https://rankupsports.github.io/basketball-gear-bags/"
     target="_blank" rel="noopener">全画面表示</a>

  <button class="lpChip lpEmbed__close" id="lpClose" type="button" hidden>閉じる ✕</button>
</div>

<script>
(function(){
  var box   = document.getElementById('lpEmbed');
  var open  = document.getElementById('lpOpen');
  var close = document.getElementById('lpClose');

  var req  = box.requestFullscreen || box.webkitRequestFullscreen;
  var exit = document.exitFullscreen || document.webkitExitFullscreen;

  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function openTab(){ window.open(open.href, '_blank', 'noopener'); }

  // 全画面 API が使えない環境（iPhone Safari など）では別タブで開く
  open.addEventListener('click', function(e){
    if(!req) return;                       // href のまま別タブへ
    e.preventDefault();
    var p;
    try { p = req.call(box); } catch(err){ openTab(); return; }
    if(p && p.catch) p.catch(openTab);
  });
  close.addEventListener('click', function(){ if(exit) exit.call(document); });

  function sync(){
    var fs = isFs();
    box.classList.toggle('is-fs', fs);
    close.hidden = !fs;
    open.hidden  = fs;
  }
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  sync();
})();
</script>
