<!-- ============================================================
     BASKETBALL GEAR BAGS 特設LP — 商品ページ埋め込み用コード
     貼り先: www.rankup-sports.com/product-page/basketball-gear-bags
     貼り方: Wix エディタ → 追加(+) → 埋め込み＆ソーシャル
             → 「HTML コードを埋め込む」を配置 → 「コードを入力」
             → 下の <meta> 以降をすべて貼り付け

     ■ 枠のサイズ（エディタ側で指定。中身は枠いっぱいに追従します）
       PC       : 幅 980px × 高さ 25,900px 以上   （LP の実測 25,659px）
       モバイル : 幅 320px × 高さ 27,300px 以上   （LP の実測 27,121px）
       ※ 枠が中身より低いと、その差分だけ末尾が枠の外に出ます。
          スクロールバーは隠しているので「切れている」ことが見えません。

     ■ 動き
       ・スクロールバーは出ません（LP 側 styles.css の html.is-embed で消しています。
         scrolling="no" は使っていないので、枠が足りないときも指やホイールで
         末尾まで送れます）。
       ・スクロールすると枠の地色が LP の背景色に追従します。LP 側（index.html の
         bgFade）が現在の色を postMessage で送るので、それを受けて
         html / body / .lpEmbed の3つに流し込んでいます。
       ・受け取った色は最上位ページ（商品ページ本体）にも中継しています。
         商品ページ側の余白まで染めたい場合は、別途
         Wix 管理画面 → 設定 → カスタムコード に
         embed/wix-page-bg-custom-code.html を貼ってください
         （このHTML埋め込みからは親ページを操作できません）。
     ============================================================ -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  *{ box-sizing: border-box; }
  /* 色が届くまでの地色。届いたら JS が同じ色で上書きする */
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
  /* ラッパー自身のスクロールバーも出さない（本来スクロールしないが保険） */
  html { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar { width: 0; height: 0; display: none; }

  .lpEmbed {
    position: relative;
    height: 100%;
    min-height: 420px;
    padding: 0px;                             /* ここが LP の色に染まるフチになる */
    border-radius: 0px;
    overflow: hidden;
    background: #ffffff;                      /* 読み込み中の地色（LP から色が届くまで） */
    box-shadow: 0 10px 30px rgba(0, 0, 0, .14);
  }
  /* 枠の中でそのままスクロールできる（pointer-events は触らない） */
  .lpEmbed iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 8px; }

  @media (max-width: 600px) {
    .lpEmbed { border-radius: 10px; padding: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }
    .lpEmbed iframe { border-radius: 6px; }
  }
</style>

<div class="lpEmbed" id="lpEmbed">
  <iframe id="lpFrame"
    src="https://rankupsports.github.io/basketball-gear-bags/"
    title="BASKETBALL GEAR BAGS 特設ページ"
    loading="lazy"
    allow="autoplay"
    referrerpolicy="no-referrer-when-downgrade"
    scrolling="yes"></iframe>
</div>

<script>
(function(){
  var box  = document.getElementById('lpEmbed');
  var html = document.documentElement;
  var body = document.body;
  var LP_ORIGIN = 'https://rankupsports.github.io';
  // rgb(0,0,0) 形式だけを通す（受け取った文字列をそのまま style に入れないため）
  var RGB = /^rgb\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\)$/;

  window.addEventListener('message', function(e){
    if (e.origin !== LP_ORIGIN) return;        // 送り主は LP だけ
    var d = e.data;
    if (!d || d.type !== 'rus-bg' || typeof d.color !== 'string') return;
    if (!RGB.test(d.color)) return;

    // 枠・この文書の地色を LP の今の背景色にそろえる
    box.style.backgroundColor  = d.color;
    body.style.backgroundColor = d.color;
    html.style.backgroundColor = d.color;

    // 商品ページ本体にも中継（受け取る側はカスタムコードで用意する）
    try {
      if (window.parent && window.parent !== window) window.parent.postMessage(d, '*');
    } catch (err) {}
  });
})();
</script>
