<!-- ============================================================
     BASKETBALL GEAR BAGS 特設LP — 商品ページ埋め込み用コード
     貼り先: www.rankup-sports.com/product-page/basketball-gear-bags
             「レビュー」ブロックのすぐ上
     貼り方: Wix エディタ → 追加(+) → 埋め込み＆ソーシャル
             → 「HTML コードを埋め込む」を配置 → 「コードを入力」
             → 下の <meta> 以降をすべて貼り付け

     サイズ（エディタ側で枠のサイズを指定してください。中身は枠いっぱいに追従します）
       PC       : 幅 980px（= サイト幅いっぱい） × 高さ 820px
       モバイル : 幅 320px（= モバイル canvas いっぱい） × 高さ 560px
     ※ もっと小さく収めたいときは PC 980×620 でも成立します（下限 420px）。

     ■ 動き
       ・枠の中で LP をそのままスクロールして見られる（全画面表示は廃止）。
       ・スクロールすると枠の地色が LP の背景色に追従して変わる。
         LP 側（index.html の bgFade）が現在の色を postMessage で送るので、
         それを受けて枠の背景に流し込んでいる。

     メモ
       - loading="lazy" なので、レビュー位置まで実際にスクロールされるまで
         LP 内の動画（合計 60MB 超）は読み込まれません。
       - LP 内の BUY NOW はリンクを切ってあるので、商品ページ → LP → 商品ページ の
         ループにはなりません。復活させるときは LP 側 index.html の BUY_LINK を戻します。
       - PC では iframe 上にカーソルがあるとホイールが LP 側に効きます。気になる場合は
         枠の高さを 620px 前後に抑えると、脇から商品ページをスクロールしやすくなります。
     ============================================================ -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  *{ box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; }

  .lpEmbed {
    position: relative;
    height: 100%;
    min-height: 420px;
    padding: 12px;                            /* ここが LP の色に染まるフチになる */
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;                      /* 読み込み中の地色（LP から色が届くまで） */
    box-shadow: 0 10px 30px rgba(0, 0, 0, .14);
  }
  /* 枠の中でそのままスクロールできる（pointer-events は触らない） */
  .lpEmbed iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 8px; }

  @media (max-width: 600px) {
    .lpEmbed { border-radius: 10px; padding: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }
    .lpEmbed iframe { border-radius: 6px; }
  }
</style>

<div class="lpEmbed" id="lpEmbed">
  <iframe id="lpFrame"
    src="https://rankupsports.github.io/basketball-gear-bags/"
    title="BASKETBALL GEAR BAGS 特設ページ"
    loading="lazy"
    allow="autoplay"
    referrerpolicy="no-referrer-when-downgrade"
    scrolling="yes"></iframe>
</div>

<script>
(function(){
  var box = document.getElementById('lpEmbed');
  var LP_ORIGIN = 'https://rankupsports.github.io';
  // rgb(0,0,0) 形式だけを通す（受け取った文字列をそのまま style に入れないため）
  var RGB = /^rgb\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\)$/;

  window.addEventListener('message', function(e){
    if (e.origin !== LP_ORIGIN) return;        // 送り主は LP だけ
    var d = e.data;
    if (!d || d.type !== 'rus-bg' || typeof d.color !== 'string') return;
    if (!RGB.test(d.color)) return;
    box.style.backgroundColor = d.color;
  });
})();
</script>
