<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>BASKETBALL GEAR BAGS — 埋め込み用</title>

<!-- ============================================================
     商品ページ埋め込み用ラッパー（URL指定モード用）

     Wix の「HTML コードを埋め込む」→「ウェブサイトのアドレス」モードは
     コードを差し込めないので、角丸・影・全画面ボタンはこのページ側に持たせる。
     Wix に貼る URL:
       https://rankupsports.github.io/basketball-gear-bags/embed/

     サイズ（Wix エディタ側で枠のサイズを指定。中身は枠いっぱいに追従）
       PC       : 980 x 820
       モバイル : 320 x 560

     ※ 装飾が不要なら、このページを経由せず LP の URL を直接貼れば
        iframe が1枚減って軽くなる:
          https://rankupsports.github.io/basketball-gear-bags/
     ============================================================ -->
<style>
  /* 角丸の外側から商品ページの地色が見えるように、地は透明にしておく。 */
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; }

  .lpEmbed {
    position: relative;
    height: 100%;
    min-height: 420px;
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;                      /* 読み込み中の地色 */
    box-shadow: 0 10px 30px rgba(0, 0, 0, .14);
  }
  .lpEmbed iframe { display: block; width: 100%; height: 100%; border: 0; }

  /* iframe 内のスクロールが窮屈な人向けの逃げ道。_blank で別タブに出す。 */
  .lpEmbed__open {
    position: absolute; right: 12px; bottom: 12px; z-index: 2;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px;
    background: rgba(20, 20, 26, .72); color: #fff; text-decoration: none;
    font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue",
          "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: background .2s ease;
  }
  .lpEmbed__open:hover { background: rgba(20, 20, 26, .92); }
  .lpEmbed__open:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  @media (max-width: 600px) {
    .lpEmbed { border-radius: 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }
    .lpEmbed__open { right: 8px; bottom: 8px; padding: 7px 12px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="lpEmbed">
  <iframe
    src="../index.html"
    title="BASKETBALL GEAR BAGS 特設ページ"
    loading="lazy"
    allow="autoplay; fullscreen"
    referrerpolicy="no-referrer-when-downgrade"
    scrolling="yes"></iframe>

  <a class="lpEmbed__open" href="../index.html" target="_blank" rel="noopener">全画面で見る ↗</a>
</div>

</body>
</html>
