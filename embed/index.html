<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>BASKETBALL GEAR BAGS — 埋め込み用</title>

<!-- ============================================================
     商品ページ埋め込み用ラッパー（URL指定モード用）

     Wix の「HTML コードを埋め込む」→「ウェブサイトのアドレス」モードは
     コードを差し込めないので、装飾はこのページ側に持たせる。
     Wix に貼る URL:
       https://rankupsports.github.io/basketball-gear-bags/embed/

     サイズ（Wix エディタ側で枠のサイズを指定。中身は枠いっぱいに追従）
       PC       : 980 x 820
       モバイル : 320 x 560

     ■ 動き
       枠の中で LP をそのままスクロールして見られる（全画面表示は廃止）。
     ============================================================ -->
<style>
  /* 角丸の外側から商品ページの地色が見えるように、地は透明にしておく。 */
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; }

  .lpEmbed {
    position: relative;
    height: 100%;
    min-height: 420px;
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;                      /* 読み込み中の地色 */
    box-shadow: 0 10px 30px rgba(0, 0, 0, .14);
  }
  /* 枠の中でそのままスクロールできる（pointer-events は触らない） */
  .lpEmbed iframe { display: block; width: 100%; height: 100%; border: 0; }

  @media (max-width: 600px) {
    .lpEmbed { border-radius: 10px; box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }
  }
</style>
</head>
<body>

<div class="lpEmbed" id="lpEmbed">
  <iframe id="lpFrame"
    src="../index.html"
    title="BASKETBALL GEAR BAGS 特設ページ"
    loading="lazy"
    allow="autoplay"
    referrerpolicy="no-referrer-when-downgrade"
    scrolling="yes"></iframe>
</div>

</body>
</html>
