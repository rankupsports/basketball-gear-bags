<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>BASKETBALL GEAR BAGS — 埋め込み用</title>

<!-- ============================================================
     商品ページ埋め込み用ラッパー（URL指定モード用）

     Wix の「HTML コードを埋め込む」→「ウェブサイトのアドレス」モードは
     コードを差し込めないので、装飾はこのページ側に持たせる。
     Wix に貼る URL:
       https://rankupsports.github.io/basketball-gear-bags/embed/

     サイズ（Wix エディタ側で枠のサイズを指定。中身は枠いっぱいに追従）
       PC       : 980 x 820
       モバイル : 320 x 560

     ■ 動き
       ・枠の中で LP をそのままスクロールして見られる。
       ・スクロールすると枠の地色が LP の背景色に追従して変わる。
         LP 側（index.html の bgFade）が現在の色を postMessage で送ってくるので、
         それを受けて枠の背景に流し込んでいる。LP と同じ色が枠のフチに出るので、
         iframe の外側まで色が続いているように見える。
     ============================================================ -->
<style>
  *{ box-sizing: border-box; }
  /* 角丸の外側から商品ページの地色が見えるように、地は透明にしておく。 */
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; }

  .lpEmbed {
    position: relative;
    height: 100%;
    min-height: 420px;
    padding: 12px;                            /* ここが LP の色に染まるフチになる */
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;                      /* 読み込み中の地色（LP から色が届くまで） */
    box-shadow: 0 10px 30px rgba(0, 0, 0, .14);
  }
  /* 枠の中でそのままスクロールできる（pointer-events は触らない） */
  .lpEmbed iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 8px; }

  @media (max-width: 600px) {
    .lpEmbed { border-radius: 10px; padding: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }
    .lpEmbed iframe { border-radius: 6px; }
  }
</style>
</head>
<body>

<div class="lpEmbed" id="lpEmbed">
  <iframe id="lpFrame"
    src="../index.html"
    title="BASKETBALL GEAR BAGS 特設ページ"
    loading="lazy"
    allow="autoplay"
    referrerpolicy="no-referrer-when-downgrade"
    scrolling="yes"></iframe>
</div>

<script>
(function(){
  var box = document.getElementById('lpEmbed');
  var LP_ORIGIN = 'https://rankupsports.github.io';
  // rgb(0,0,0) 形式だけを通す（受け取った文字列をそのまま style に入れないため）
  var RGB = /^rgb\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\)$/;

  window.addEventListener('message', function(e){
    // 送り主は LP（本番は github.io / ローカル確認時は同一オリジン）だけ
    if (e.origin !== LP_ORIGIN && e.origin !== location.origin) return;
    var d = e.data;
    if (!d || d.type !== 'rus-bg' || typeof d.color !== 'string') return;
    if (!RGB.test(d.color)) return;
    box.style.backgroundColor = d.color;
  });
})();
</script>

</body>
</html>
